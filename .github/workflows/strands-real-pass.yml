name: Strands Real PASS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  strands-real-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Pre-install publication safety
        run: python scripts/publication_safety_scan.py

      - name: Download and verify exact Strands wheel
        shell: bash
        run: |
          mkdir -p .afh-wheel
          python -m pip download --no-deps --only-binary=:all: --dest .afh-wheel strands-agents==1.54.0
          test -f .afh-wheel/strands_agents-1.54.0-py3-none-any.whl
          echo "ca37b9001531596a634e9249f97fb03ce70997e216f6a71d4e8f8182818cbf5c  .afh-wheel/strands_agents-1.54.0-py3-none-any.whl" | sha256sum -c -

      - name: Install verified Strands runtime
        shell: bash
        run: |
          python -m pip install .afh-wheel/strands_agents-1.54.0-py3-none-any.whl
          python - <<'PY'
          from importlib.metadata import version
          actual = version('strands-agents')
          print('strands-agents', actual)
          assert actual == '1.54.0', actual
          PY

      - name: Install app/test dependencies
        run: python -m pip install fastapi==0.128.2 uvicorn==0.48.0 httpx==0.28.1

      - name: Run public regression with bytecode disabled
        run: python scripts/verify_publication.py 2>&1 | tee UNIT_TESTS_REAL_RUN.txt

      - name: Run REAL Strands interrupt/resume PASS
        env:
          AFH_STRANDS_WHEEL: .afh-wheel/strands_agents-1.54.0-py3-none-any.whl
        run: python run_strands_real_pass.py | tee STRANDS_REAL_PASS.log

      - name: Verify evidence says PASS
        run: |
          python - <<'PY'
          import json
          d = json.load(open('STRANDS_REAL_PASS.json'))
          assert d['pass'] is True, d['assessment_reasons']
          r = d['runtime']
          assert r['status'] == 'PASS'
          assert r['strands_version'] == '1.54.0'
          assert r['first_stop_reason'] == 'interrupt'
          assert r['final_stop_reason'] == 'end_turn'
          assert r['effect_count'] == 1
          assert r['execution_status'] == 'COMMITTED'
          assert r['mutation_blocked'] is True
          print('AFH STRANDS REAL PASS VERIFIED')
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afh-strands-real-pass-${{ github.run_id }}
          path: |
            STRANDS_REAL_PASS.json
            STRANDS_REAL_PASS.log
            UNIT_TESTS_REAL_RUN.txt
          if-no-files-found: error
          retention-days: 30
