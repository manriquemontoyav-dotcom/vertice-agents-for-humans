<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f7f8fb"/>
<style>.t{font-family:Arial,sans-serif;fill:#101827}.h{font-size:42px;font-weight:700}.s{font-size:22px;fill:#536078}.b{fill:#fff;stroke:#c9d2e3;stroke-width:2;rx:18}.bh{font-size:24px;font-weight:700}.bt{font-size:18px;fill:#536078}.arrow{stroke:#596780;stroke-width:4;fill:none;marker-end:url(#m)}.guard{fill:#eef4ff;stroke:#3465d9;stroke-width:3;rx:18}.human{fill:#fff6e8;stroke:#cc7a00;stroke-width:3;rx:18}.evidence{fill:#effaf4;stroke:#168a52;stroke-width:3;rx:18}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#596780"/></marker></defs>
<text x="80" y="75" class="t h">Agents for Humans · v0.9.2 architecture</text>
<text x="80" y="115" class="t s">Agents should do the work. Humans should make the decisions.</text>
<rect x="80" y="220" width="230" height="140" class="b"/><text x="110" y="270" class="t bh">Human Mandate</text><text x="110" y="305" class="t bt">objective · scope</text><text x="110" y="335" class="t bt">authority budget</text>
<rect x="390" y="220" width="260" height="140" class="b"/><text x="420" y="270" class="t bh">Strands Agent</text><text x="420" y="305" class="t bt">agent loop · tools</text><text x="420" y="335" class="t bt">interrupt / resume</text>
<rect x="730" y="190" width="310" height="200" class="guard"/><text x="760" y="245" class="t bh">AFH Authority Boundary</text><text x="760" y="285" class="t bt">semantic materiality</text><text x="760" y="315" class="t bt">action + mandate freeze</text><text x="760" y="345" class="t bt">fail-closed intervention</text>
<rect x="1120" y="200" width="370" height="180" class="human"/><text x="1150" y="250" class="t bh">Decision Inbox</text><text x="1150" y="290" class="t bt">26 autonomous steps → 1 decision</text><text x="1150" y="325" class="t bt">Approve exact action / Reject</text><text x="1150" y="355" class="t bt">Decision Receipt</text>
<rect x="700" y="530" width="360" height="190" class="guard"/><text x="730" y="580" class="t bh">Constrained Resume Guard</text><text x="730" y="620" class="t bt">toolUseId + Decision Receipt</text><text x="730" y="650" class="t bt">idempotency · mutation/replay block</text><text x="730" y="680" class="t bt">exact consequential execution</text>
<rect x="1160" y="550" width="300" height="150" class="b"/><text x="1190" y="600" class="t bh">External Effect</text><text x="1190" y="640" class="t bt">provider receives</text><text x="1190" y="670" class="t bt">idempotency key</text>
<rect x="210" y="540" width="350" height="160" class="evidence"/><text x="240" y="590" class="t bh">Evidence Continuity</text><text x="240" y="630" class="t bt">work → boundary → decision</text><text x="240" y="660" class="t bt">→ execution receipt</text>
<path d="M310 290 L390 290" class="arrow"/><path d="M650 290 L730 290" class="arrow"/><path d="M1040 290 L1120 290" class="arrow"/><path d="M1300 380 C1300 470 1060 470 1030 530" class="arrow"/><path d="M1060 625 L1160 625" class="arrow"/><path d="M700 625 L560 625" class="arrow"/><path d="M885 390 L885 530" class="arrow"/>
<text x="80" y="820" class="t bt">Hackathon demo: Strands integration + Decision Inbox + guarded simulated effect. No production credentials or external side effects.</text>
</svg>